name: Validate data

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Validate schema examples
        run: python scripts/validate_examples.py
